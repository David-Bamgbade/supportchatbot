<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101014">

    <title>Support AI — Customer Care</title>

    <link rel="icon" type="image/svg+xml"
          href="{{ url_for('static', filename='favicon.svg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="icon" type="image/png" href="https://your-website.com/logo.png">      
</head>

<body>
    <main class="app">

        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-icon">S</span>
                <span>support<span class="brand-light">ai</span></span>
            </a>

            <div class="topbar-right">
                <span class="status">
                    <span class="status-dot"></span>
                    AI assistant online
                </span>

                <button id="reset-button" class="new-chat-button" type="button">
                    <span>+</span> New chat
                </button>
            </div>
        </header>

        <section class="chat-area">
            <div id="chat-messages" class="chat-messages">

                <div class="welcome">
                    <div class="welcome-orb">
                        <span></span>
                    </div>

                    <p class="eyebrow">YOUR AI SUPPORT ASSISTANT</p>

                    <h1>How can we<br><span>help you today?</span></h1>

                    <p class="welcome-description">
                        Have a question? Need assistance?
                        Start a conversation and we'll help you find the answer.
                    </p>

                    <div class="suggestions">
                        <button class="suggestion" type="button">
                            <span class="suggestion-icon">↗</span>
                            <span>
                                <strong>Product information</strong>
                                <small>Learn more about our products and services</small>
                            </span>
                        </button>

                        <button class="suggestion" type="button">
                            <span class="suggestion-icon">?</span>
                            <span>
                                <strong>Frequently asked questions</strong>
                                <small>Get answers to common questions</small>
                            </span>
                        </button>

                        <button class="suggestion" type="button">
                            <span class="suggestion-icon">◎</span>
                            <span>
                                <strong>Account assistance</strong>
                                <small>Get help with your account</small>
                            </span>
                        </button>

                        <button class="suggestion" type="button">
                            <span class="suggestion-icon">✳</span>
                            <span>
                                <strong>Speak to support</strong>
                                <small>Find out how to reach our support team</small>
                            </span>
                        </button>
                    </div>
                </div>

            </div>

            <button class="suggestion"
        type="button"
        data-message="Tell me about your products and services.">
    <span class="suggestion-icon">↗</span>
    <span>
        <strong>Product information</strong>
        <small>Learn more about our products and services</small>
    </span>
</button>

            <div class="composer-area">
                <div id="error-banner" hidden></div>

                <form id="chat-form" class="composer">
                    <textarea
                        id="message-input"
                        name="message"
                        placeholder="Ask us anything..."
                        rows="1"
                        autocomplete="off"
                        required
                    ></textarea>

                    <button id="send-button" type="submit" aria-label="Send message">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>
                </form>

                <p class="composer-note">
                    AI responses can make mistakes. Please verify important information.
                </p>
            </div>
        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
